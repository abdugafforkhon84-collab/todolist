<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CRM — Учет клиентов и оплат</title>
    <meta name="description" content="Минималистичная система учета клиентов, контроля оплат и задолженностей с PWA" />
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CRM Учет" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />

    <!-- Inter Google Font for crisp typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
    <script>
      // Регистрация Service Worker для PWA с автоматическим обновлением кеша
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('CRM PWA Service Worker зарегистрирован:', registration.scope);
              // Проверяем наличие новой версии сразу при загрузке
              registration.update();

              registration.onupdatefound = () => {
                const installing = registration.installing;
                if (installing) {
                  installing.onstatechange = () => {
                    if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('Доступна новая версия CRM, перезагружаем страницу...');
                      window.location.reload();
                    }
                  };
                }
              };
            })
            .catch((err) => console.log('Ошибка регистрации SW:', err));

          let isReloading = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!isReloading) {
              isReloading = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
